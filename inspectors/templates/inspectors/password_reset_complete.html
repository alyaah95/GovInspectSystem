{% extends 'base.html' %}

{% block content %}
<div dir="rtl" class="min-h-screen bg-gray-50/30 flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md">
        
        <!-- Success Card -->
        <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden transition-all duration-500 hover:shadow-2xl hover:-translate-y-2">
            
            <div class="p-12 text-center space-y-6">
                <!-- Success Icon -->
                <div class="w-20 h-20 mx-auto rounded-full bg-green-50 flex items-center justify-center">
                    <svg class="w-10 h-10 text-green-600" stroke-width="1.2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>

                <!-- Title -->
                <div class="space-y-2">
                    <h2 class="text-2xl font-medium text-gray-900">تمت إعادة تعيين كلمة المرور</h2>
                    <p class="text-gray-600 leading-relaxed">
                        لقد تم إعادة تعيين كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة
                    </p>
                </div>

                <!-- Login Button -->
                <a href="{% url 'login' %}" 
                   class="inline-flex items-center justify-center gap-2 px-8 py-3.5 bg-red-600 text-white rounded-2xl hover:bg-red-700 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 font-medium w-full">
                    تسجيل الدخول
                </a>
            </div>

        </div>

    </div>
</div>
{% endblock %}
