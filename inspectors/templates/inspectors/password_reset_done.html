{% extends 'base.html' %}

{% block content %}
<div dir="rtl" class="min-h-screen bg-gray-50/30 flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md">
        
        <!-- Success Card -->
        <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden transition-all duration-500 hover:shadow-2xl hover:-translate-y-2">
            
            <div class="p-12 text-center space-y-6">
                <!-- Email Icon -->
                <div class="w-20 h-20 mx-auto rounded-full bg-red-50 flex items-center justify-center">
                    <svg class="w-10 h-10 text-red-600" stroke-width="1.2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
                    </svg>
                </div>

                <!-- Title -->
                <div class="space-y-2">
                    <h2 class="text-2xl font-medium text-gray-900">تم إرسال الرابط</h2>
                    <p class="text-gray-600 leading-relaxed">
                        إذا كان بريدك الإلكتروني مسجلاً لدينا، فستصلك رسالة تحتوي على تعليمات لإعادة تعيين كلمة المرور. يرجى التحقق من صندوق الوارد الخاص بك، أو مجلد الرسائل غير المرغوبة (Spam)
                    </p>
                </div>

                <!-- Back to Login Button -->
                <a href="{% url 'login' %}" 
                   class="inline-flex items-center justify-center gap-2 px-8 py-3.5 bg-red-600 text-white rounded-2xl hover:bg-red-700 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 font-medium w-full">
                    العودة إلى صفحة تسجيل الدخول
                </a>
            </div>

        </div>

    </div>
</div>
{% endblock %}
